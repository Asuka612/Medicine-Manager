services:

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: medication_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      - db
      - rabbitmq

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      - rabbitmq

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: